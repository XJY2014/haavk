<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAAVK CORP // 控制台</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <div class="panel">
    <h2>&gt; 骇爪控制台</h2>
    <div class="log">
      <div>> 已连接至 HAAVK 内部网络。</div>
      <div>> 当前目标：渗透集团内部节点，获取破译点数。</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="log" id="progressLabel" style="margin-top:8px;">节点渗透进度：0 / 4</div>
  </div>

  <div class="panel">
    <h2>&gt; 可渗透模块</h2>
    <div class="grid-2" id="moduleGrid"></div>
  </div>

  <div class="grid-2">
    <div class="panel">
      <h2>&gt; 终端日志</h2>
      <div class="terminal" id="terminal"></div>
    </div>
    <div class="panel">
      <h2>&gt; 操作</h2>
      <div class="log" id="hintBox"></div>
      <div class="btn-row" style="margin-top:16px;">
        <button class="btn" id="toForumBtn">进入员工论坛</button>
        <button class="btn warn" id="resetBtn">重置全部进度</button>
      </div>
    </div>
  </div>
</div>

<script src="js/shared.js"></script>
<script>
  injectTopbar("index");

  const terminal = document.getElementById("terminal");
  const fill = document.getElementById("progressFill");
  const label = document.getElementById("progressLabel");
  const grid = document.getElementById("moduleGrid");
  const hintBox = document.getElementById("hintBox");

  function render() {
    const cur = loadProgress();
    const pct = (cur.hacked.length / NODES.length) * 100;
    fill.style.width = pct + "%";
    label.textContent = `节点渗透进度：${cur.hacked.length} / ${NODES.length}`;

    grid.innerHTML = "";
    NODES.forEach(node => {
      const hacked = isHacked(cur, node.id);
      const card = document.createElement("div");
      card.className = "card" + (hacked ? "" : " locked");
      card.innerHTML = `
        <h3>${node.name} ${hacked ? '<span class="tag ok">已渗透</span>' : '<span class="tag">未渗透</span>'}</h3>
        <p>${hacked ? "该节点已被接管，可随时访问。" : "尚未完成渗透，进入该模块继续操作。"}</p>
      `;
      card.style.cursor = "pointer";
      card.onclick = () => { location.href = node.page; };
      grid.appendChild(card);
    });

    terminal.innerHTML = "";
    addLog(terminal, "> HAAVK 内部网络接入终端 v2.0", "ok");
    addLog(terminal, "> 破译点数：" + cur.decodePoints);
    cur.hacked.forEach(id => {
      const node = NODES.find(n => n.id === id);
      if (node) addLog(terminal, `[OK] ${node.name} 节点已接管。`, "ok");
    });
    if (cur.clues.length > 0) addLog(terminal, `[OK] 已提交 ${cur.clues.length} 条寻人线索。`, "ok");
    if (cur.priceChanged) addLog(terminal, "[WARN] 解决方案价格已被篡改。", "warn");

    if (cur.hacked.length === 0) {
      hintBox.innerHTML = '<span class="warn">提示：先进入员工论坛回复帖子获取破译点。</span>';
    } else if (!isHacked(cur, "forum")) {
      hintBox.innerHTML = '提示：继续在员工论坛积累破译点并骇入论坛节点。';
    } else if (!isHacked(cur, "about")) {
      hintBox.innerHTML = '提示：前往“关于我们”执行主站骇入。';
    } else if (cur.clues.length < 2) {
      hintBox.innerHTML = '提示：前往“寻人启事”提交线索。';
    } else if (!cur.priceChanged) {
      hintBox.innerHTML = '提示：前往“解决方案”篡改商品价格。';
    } else {
      hintBox.innerHTML = '<span class="ok">全部渗透完成。你已完全控制 HAAVK 内部网络。</span>';
    }
  }

  document.getElementById("toForumBtn").onclick = () => { location.href = "pages/forum.html"; };
  document.getElementById("resetBtn").onclick = () => {
    if (confirm("确定要重置全部进度吗？")) resetProgress();
  };

  render();
</script>
</body>
</html>
