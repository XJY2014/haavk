<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAAVK CORP // 内部网络</title>
<style>
  :root {
    --bg: #05080a;
    --panel: #0b1116;
    --line: #1c2a33;
    --green: #4dff9e;
    --dim: #2a7a55;
    --text: #c8e6d8;
    --warn: #ffb347;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Consolas", "Courier New", monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  .scanlines {
    position: fixed; inset: 0; pointer-events: none; z-index: 9;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
    opacity: .5;
  }
  header {
    width: 100%; max-width: 980px;
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 16px 20px;
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px;
  }
  header h1 { font-size: 18px; letter-spacing: 4px; color: var(--green); }
  header .status { font-size: 12px; color: var(--dim); }
  .layout {
    width: 100%; max-width: 980px;
    display: grid; grid-template-columns: 1.1fr .9fr; gap: 16px;
  }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }
  .panel {
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 16px;
    min-height: 260px;
  }
  .panel h2 {
    font-size: 13px; letter-spacing: 2px; color: var(--green);
    margin-bottom: 12px; border-bottom: 1px dashed var(--line); padding-bottom: 8px;
  }
  .nodes { display: flex; flex-direction: column; gap: 10px; }
  .node {
    border: 1px solid var(--line);
    background: #070d11;
    padding: 12px;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; transition: all .2s;
  }
  .node:hover { border-color: var(--dim); background: #0a141a; }
  .node.hacked { border-color: var(--green); box-shadow: 0 0 12px rgba(77,255,158,.15); }
  .node .name { font-size: 13px; }
  .node .tag { font-size: 11px; color: var(--dim); }
  .node.hacked .tag { color: var(--green); }
  #terminal {
    height: 260px; overflow-y: auto; font-size: 12px; line-height: 1.7;
    background: #030608; border: 1px solid var(--line); padding: 10px;
    white-space: pre-wrap; word-break: break-all;
  }
  #terminal .ok { color: var(--green); }
  #terminal .warn { color: var(--warn); }
  #terminal .dim { color: var(--dim); }
  .progress-wrap { margin-top: 12px; }
  .progress-bar { height: 6px; background: #0a141a; border: 1px solid var(--line); }
  .progress-fill { height: 100%; width: 0%; background: var(--green); transition: width .4s; }
  .progress-label { font-size: 11px; color: var(--dim); margin-top: 6px; }
  .btn {
    margin-top: 12px; width: 100%; padding: 10px;
    background: transparent; border: 1px solid var(--dim); color: var(--green);
    font-family: inherit; font-size: 12px; letter-spacing: 2px; cursor: pointer;
  }
  .btn:hover { background: rgba(77,255,158,.08); }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .reward {
    margin-top: 12px; font-size: 12px; color: var(--warn);
    border: 1px dashed var(--line); padding: 10px; display: none;
  }
  .reward.show { display: block; }
</style>
</head>
<body>
<div class="scanlines"></div>

<header>
  <h1>HAAVK CORP // 内部网络</h1>
  <div class="status" id="status">连接中...</div>
</header>

<div class="layout">
  <section class="panel">
    <h2>&gt; 可骇入节点</h2>
    <div class="nodes" id="nodes"></div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">骇入进度 0 / 4</div>
    </div>
    <button class="btn" id="resetBtn">重置进度</button>
  </section>

  <section class="panel">
    <h2>&gt; 控制台输出</h2>
    <div id="terminal"></div>
    <div class="reward" id="reward">
      [隐藏奖励] 价格篡改成功，已注入 500,000 哈夫币。
    </div>
  </section>
</div>

<script>
  const NODES = [
    { id: "gateway", name: "外网网关 gateway.haavk.corp", tag: "未接入", hacked: false },
    { id: "forum",   name: "员工论坛 forum.haavk.corp",   tag: "未接入", hacked: false },
    { id: "store",   name: "军需商店 store.haavk.corp",   tag: "未接入", hacked: false },
    { id: "core",    name: "核心数据库 core.haavk.corp",  tag: "锁定",   hacked: false },
  ];

  const STORAGE_KEY = "haavk_hack_progress";
  const terminal = document.getElementById("terminal");
  const nodesEl = document.getElementById("nodes");
  const progressFill = document.getElementById("progressFill");
  const progressLabel = document.getElementById("progressLabel");
  const statusEl = document.getElementById("status");
  const rewardEl = document.getElementById("reward");
  const resetBtn = document.getElementById("resetBtn");

  let state = loadState();

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { hacked: [], reward: false };
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function log(msg, cls = "") {
    const line = document.createElement("div");
    if (cls) line.className = cls;
    line.textContent = msg;
    terminal.appendChild(line);
    terminal.scrollTop = terminal.scrollHeight;
  }

  function render() {
    nodesEl.innerHTML = "";
    NODES.forEach((node, i) => {
      const hacked = state.hacked.includes(node.id);
      const locked = node.id === "core" && state.hacked.length < 3;
      const div = document.createElement("div");
      div.className = "node" + (hacked ? " hacked" : "");
      div.innerHTML = `
        <div>
          <div class="name">${node.name}</div>
          <div class="tag">${hacked ? "已骇入" : locked ? "锁定：需先骇入其他 3 个节点" : node.tag}</div>
        </div>
        <div class="tag">${hacked ? "[OK]" : locked ? "[LOCK]" : "[TAP]"}</div>
      `;
      if (!hacked && !locked) {
        div.addEventListener("click", () => hackNode(node));
      }
      nodesEl.appendChild(div);
    });

    const pct = (state.hacked.length / NODES.length) * 100;
    progressFill.style.width = pct + "%";
    progressLabel.textContent = `骇入进度 ${state.hacked.length} / ${NODES.length}`;
    statusEl.textContent = state.hacked.length === NODES.length ? "完全控制" : "已连接";
    rewardEl.classList.toggle("show", state.reward);
  }

  function hackNode(node) {
    if (state.hacked.includes(node.id)) return;
    log(`> 正在连接 ${node.name} ...`, "dim");
    setTimeout(() => {
      state.hacked.push(node.id);
      log(`[OK] ${node.name} 骇入成功`, "ok");

      if (node.id === "store") {
        log("[WARN] 检测到价格字段可写，正在篡改图灵砖价格...", "warn");
        state.reward = true;
        log("[OK] 价格篡改完成，隐藏奖励已注入。", "ok");
      }
      if (node.id === "core") {
        log("[OK] 核心数据库已接管，全部节点控制完成。", "ok");
      }
      saveState();
      render();
    }, 600);
  }

  resetBtn.addEventListener("click", () => {
    state = { hacked: [], reward: false };
    saveState();
    terminal.innerHTML = "";
    log("> 进度已重置。", "dim");
    render();
  });

  log("> HAAVK 内部网络接入终端 v1.0", "ok");
  log("> 点击左侧节点开始骇入。", "dim");
  render();
</script>
</body>
</html>
