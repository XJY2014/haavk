<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联系我们 // HAAVK CORP</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="container">
  <div class="grid-2">
    <div class="panel">
      <h2>联系方式</h2>
      <p>地址：阿萨拉地区哈夫克总部园区</p>
      <p>电话：+00 400-000-0000</p>
      <p>邮箱：contact@haavk.corp</p>
      <p>工作时间：周一至周五 09:00 - 18:00</p>
    </div>
    <div class="panel">
      <h2>在线咨询</h2>
      <div class="form-row">
        <label>姓名</label>
        <input type="text" id="nameInput" placeholder="请输入姓名">
      </div>
      <div class="form-row">
        <label>留言</label>
        <textarea id="msgInput" rows="4" placeholder="请输入咨询内容"></textarea>
      </div>
      <button class="btn primary" id="sendBtn">提交咨询</button>
      <div style="margin-top:12px; font-size:12px; color:var(--dim);" id="sendStatus"></div>
    </div>
  </div>
</div>
<script src="../js/shared.js?v=3"></script>
<script>
  injectTopbar("contact");
  addVisited("contact");

  const nameInput = document.getElementById("nameInput");
  const msgInput = document.getElementById("msgInput");
  const sendBtn = document.getElementById("sendBtn");
  const sendStatus = document.getElementById("sendStatus");

  sendBtn.addEventListener("click", () => {
    const name = nameInput.value.trim();
    const msg = msgInput.value.trim();
    if (!name || !msg) {
      sendStatus.textContent = "请填写姓名和留言内容。";
      return;
    }
    const p = loadProgress();
    p.inquiryCount += 1;
    saveProgress(p);
    toast("咨询已提交");
    sendStatus.innerHTML = `<span style="color:var(--accent);">咨询已提交，感谢你的留言。累计提交 ${p.inquiryCount} 次。</span>`;
    nameInput.value = "";
    msgInput.value = "";
  });
</script>
</body>
</html>
