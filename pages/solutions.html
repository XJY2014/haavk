<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>解决方案 // HAAVK</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="container">
  <div class="panel">
    <h2>&gt; 军需商品</h2>
    <div class="item-row">
      <div class="label">图灵砖 <span class="tag">原价 50,000</span></div>
      <input type="number" id="priceInput" value="50000" min="1">
      <button class="btn" id="setPriceBtn">篡改价格</button>
    </div>
    <div class="log" id="priceStatus" style="margin-top:12px;"></div>
  </div>

  <div class="panel" id="rewardPanel" style="display:none;">
    <h2>&gt; 隐藏奖励</h2>
    <div class="log ok">价格篡改成功。哈德森已注入 500,000 哈夫币。</div>
  </div>

  <div class="panel">
    <h2>&gt; 状态</h2>
    <div class="log" id="status"></div>
  </div>
</div>
<script src="../js/shared.js"></script>
<script>
  injectTopbar("solutions");

  const input = document.getElementById("priceInput");
  const btn = document.getElementById("setPriceBtn");
  const priceStatus = document.getElementById("priceStatus");
  const rewardPanel = document.getElementById("rewardPanel");
  const statusEl = document.getElementById("status");

  function render() {
    const p = loadProgress();
    if (!isHacked(p, "missing")) {
      statusEl.innerHTML = '<span class="warn">前置条件：需先完成“寻人启事”全部线索。</span>';
      btn.disabled = true;
    } else if (p.priceChanged) {
      statusEl.innerHTML = '<span class="ok">前置条件已满足，价格已篡改。</span>';
      priceStatus.innerHTML = '<span class="ok">[OK] 价格已被篡改。</span>';
      rewardPanel.style.display = "block";
      btn.disabled = true;
      input.disabled = true;
    } else {
      statusEl.innerHTML = '<span class="ok">前置条件已满足。尝试调高价格。</span>';
      btn.disabled = false;
    }
  }

  btn.onclick = () => {
    const p = loadProgress();
    if (!isHacked(p, "missing") || p.priceChanged) return;
    const val = parseInt(input.value);
    if (isNaN(val) || val <= 0) {
      priceStatus.textContent = "请输入有效价格。";
      return;
    }
    if (val > 50000) {
      p.priceChanged = true;
      p.decodePoints += 50;
      saveProgress(p);
      toast("价格篡改成功，隐藏奖励已触发");
      render();
    } else {
      priceStatus.innerHTML = `<span class="warn">[WARN] 价格降至 ${val}，未触发隐藏奖励。请尝试调高。</span>`;
    }
  };

  render();
</script>
</body>
</html>
